# Basic KeyDB configuration
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Authentication
requirepass password
# masterauth your_password_here 

# User configuration
# user default on +@all ~* >default_password
user root on +@all ~* >password

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory management
maxmemory 100mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Performance
activerehashing yes